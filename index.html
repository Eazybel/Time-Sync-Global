<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Sync Global</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <section class="extension-frame">
      <header class="app-header">
        <section class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-label="Time Sync Global logo">
              <path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4 4l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </div>
          <div>
            <span class="brand-kicker">Time Sync</span>
            <h1>Global Converter</h1>
          </div>
        </section>

        <section class="header-actions">
          <button class="icon-button" id="nowButton" title="Use current time">
            <svg viewBox="0 0 24 24" fill="none" aria-label="Current time">
              <path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
        </section>
      </header>

      <main class="converter-content">
        <section class="form-panel">
          <section class="section-title">
            <h2>Set Base Reference</h2>
            <span class="section-tag" id="todayTag">Today</span>
          </section>

          <section class="reference-grid">
            <section class="form-field">
              <label for="baseLocation">Base Location</label>
              <input type="text" id="baseLocation" list="timezone-list" autocomplete="off" placeholder="Search location">
            </section>

            <section class="form-field">
              <label for="baseDateTime">Date &amp; Time</label>
              <input type="datetime-local" id="baseDateTime">
            </section>
          </section>

          <section class="section-title" style="margin-top: 20px;">
            <h2>Target Locations</h2>
            <span class="section-tag">4 Cities</span>
          </section>

          <section class="compare-grid">
            <section class="compare-card">
              <h3>Location 1</h3>
              <section class="compare-location">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 21s8-7 8-12a8 8 0 0 0-16 0c0 5 8 12 8 12Z" stroke="currentColor" stroke-width="2" fill="none" />
                  <circle cx="12" cy="9" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
                <span id="locationName1">New York</span>
              </section>
              <section class="compare-time" id="compareTime1">--:--</section>
              <section class="compare-date" id="compareDate1">--</section>
              <section class="compare-zone" id="compareZone1">America/New_York</section>
            </section>

            <section class="compare-card">
              <h3>Location 2</h3>
              <section class="compare-location">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 21s8-7 8-12a8 8 0 0 0-16 0c0 5 8 12 8 12Z" stroke="currentColor" stroke-width="2" fill="none" />
                  <circle cx="12" cy="9" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
                <span id="locationName2">London</span>
              </section>
              <section class="compare-time" id="compareTime2">--:--</section>
              <section class="compare-date" id="compareDate2">--</section>
              <section class="compare-zone" id="compareZone2">Europe/London</section>
            </section>

            <section class="compare-card">
              <h3>Location 3</h3>
              <section class="compare-location">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 21s8-7 8-12a8 8 0 0 0-16 0c0 5 8 12 8 12Z" stroke="currentColor" stroke-width="2" fill="none" />
                  <circle cx="12" cy="9" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
                <span id="locationName3">Dubai</span>
              </section>
              <section class="compare-time" id="compareTime3">--:--</section>
              <section class="compare-date" id="compareDate3">--</section>
              <section class="compare-zone" id="compareZone3">Asia/Dubai</section>
            </section>

            <section class="compare-card">
              <h3>Location 4</h3>
              <section class="compare-location">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 21s8-7 8-12a8 8 0 0 0-16 0c0 5 8 12 8 12Z" stroke="currentColor" stroke-width="2" fill="none" />
                  <circle cx="12" cy="9" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
                <span id="locationName4">Singapore</span>
              </section>
              <section class="compare-time" id="compareTime4">--:--</section>
              <section class="compare-date" id="compareDate4">--</section>
              <section class="compare-zone" id="compareZone4">Asia/Singapore</section>
            </section>
          </section>

          <section class="actions-row">
            <button class="primary-button" id="convertBtn">Convert Time</button>
            <button class="secondary-button" id="resetBtn">Reset</button>
          </section>

          <section class="status-line" id="statusLine"></section>
        </section>
      </main>

      <footer class="footer">
        <span class="footer-dot"></span>
        <span>Time Sync Global</span>
      </footer>
    </section>
  </div>

  <datalist id="timezone-list"></datalist>

  <script src="script.js"></script>
</body>
</html>
